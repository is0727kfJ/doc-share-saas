version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: timestamp
            go_type:
              import: "time"
              package: "time"
              type: "Time"
          - db_type: timestamptz
            go_type:
              import: "time"
              package: "time"
              type: "Time"